<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : la page passe sous l'encoche, on recupere la zone sure en CSS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="A Timeless Journey - jeu d'exploration 2D pixel art a travers le temps"
    />
    <title>A Timeless Journey</title>
    <link rel="icon" type="image/png" href="/icone.png" />
    <link rel="apple-touch-icon" href="/icone.png" />

    <!--
      Style minimal, ecrit dans la page plutot que dans la feuille de style.

      Si la feuille de style ne se charge pas, le navigateur affiche la page
      brute : fond blanc, police a empattements, et surtout tout ce qui devait
      rester cache devient visible. Ces quelques regles garantissent que l'echec
      reste lisible et n'affiche jamais d'information fausse.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d17;
        color: #e8e6f0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* Cache par defaut : ce message ne doit apparaitre que si l'appareil est
         reellement en paysage, ce que seule la feuille de style sait decider. */
      #rotate-prompt {
        display: none;
      }

      /* Visible par defaut, retire par le jeu des qu'il demarre : une page qui
         ne charge pas dit ainsi ce qui ne va pas, au lieu de rester blanche. */
      #echec-chargement {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        line-height: 1.5;
      }

      #echec-chargement strong {
        color: #6bd6c4;
        font-size: 1.1rem;
      }

      #echec-chargement span {
        font-size: 0.85rem;
        opacity: 0.7;
        max-width: 22rem;
      }
    </style>
    <link rel="stylesheet" href="/src/styles/game.css" />
  </head>
  <body>
    <div id="game-root"></div>

    <div id="echec-chargement">
      <strong>Le jeu n'a pas pu demarrer.</strong>
      <span>
        Les fichiers du jeu n'ont pas ete trouves. Si cette page vient d'etre
        publiee, verifie que la source de GitHub Pages est bien reglee sur
        GitHub Actions.
      </span>
    </div>

    <!-- Affiche uniquement en paysage sur ecran tactile : le jeu se joue en portrait -->
    <div id="rotate-prompt" aria-hidden="true">
      <div class="rotate-prompt__icon">&#x21bb;</div>
      <p class="rotate-prompt__text">Tourne ton telephone<br />en mode portrait</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
