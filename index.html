<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : la page passe sous l'encoche, on recupere la zone sure en CSS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="A Timeless Journey - jeu d'exploration 2D pixel art a travers le temps"
    />
    <title>A Timeless Journey</title>
    <link rel="icon" type="image/png" href="/icone.png" />
    <link rel="apple-touch-icon" href="/icone.png" />
    <link rel="stylesheet" href="/src/styles/game.css" />
  </head>
  <body>
    <div id="game-root"></div>

    <!-- Affiche uniquement en paysage sur ecran tactile : le jeu se joue en portrait -->
    <div id="rotate-prompt" aria-hidden="true">
      <div class="rotate-prompt__icon">&#x21bb;</div>
      <p class="rotate-prompt__text">Tourne ton telephone<br />en mode portrait</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
